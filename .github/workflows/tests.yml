# Proves the repo installs and works from a clean clone on Linux and Windows.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ALLOW_NETWORK: "0"   # tests never hit external APIs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (same command as the README)
        run: pip install -r requirements.txt
      - name: Run tests (features, model, resilience, every dashboard page)
        run: python -m pytest -q
