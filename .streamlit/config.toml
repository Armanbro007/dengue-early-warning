# "Soft glass" theme: cool grey canvas, frosted white cards, ink-black accents.
# Fonts are bundled in static/fonts (SIL Open Font License), so the look works offline,
# and Noto Sans Bengali covers the Bangla version.
[theme]
base = "light"
primaryColor = "#111318"
backgroundColor = "#ECEDF1"
secondaryBackgroundColor = "#F4F5F8"
textColor = "#111318"
linkColor = "#111318"
linkUnderline = false
borderColor = "#E2E4EA"
dataframeBorderColor = "#ECEDF0"
dataframeHeaderBackgroundColor = "#F6F7F9"
showWidgetBorder = false
showSidebarBorder = false
baseRadius = "14px"
buttonRadius = "999px"
font = "Geist, 'Noto Sans Bengali', 'Segoe UI', system-ui, sans-serif"
headingFont = "Geist, 'Noto Sans Bengali', 'Segoe UI', system-ui, sans-serif"
codeFont = "'Geist Mono', ui-monospace, monospace"
headingFontWeights = [650, 650, 600, 600, 600, 600]
metricValueFontWeight = 650

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/Geist-latin.woff2"
weight = "300 800"
style = "normal"

[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/fonts/GeistMono-latin.woff2"
weight = "400 600"
style = "normal"

[[theme.fontFaces]]
family = "Noto Sans Bengali"
url = "app/static/fonts/NotoSansBengali-bengali.woff2"
weight = "300 800"
style = "normal"

[theme.sidebar]
backgroundColor = "#ECEDF1"
secondaryBackgroundColor = "#F4F5F8"

[server]
headless = true
runOnSave = false
enableStaticServing = true

[browser]
gatherUsageStats = false
